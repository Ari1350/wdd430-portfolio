<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week1</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <article id="direct-news"></article>
    <article id="react-news"></article>

    <script>
        const newsArticle = document.getElementById('direct-news');
        const newParagraph = document.createElement('p');
        const text = "Breaking news: Imperative programming!";
        const headerContent = document.createTextNode(text);
        newParagraph.appendChild(headerContent);  
        newsArticle.appendChild(newParagraph);
    </script>

    <script type="text/jsx">
        const domNode = document.getElementById('react-news');
        const root = ReactDOM.createRoot(domNode);
        root.render(<p>Breaking news: React is awesome!</p>);
    </script>
</body>
</html>
